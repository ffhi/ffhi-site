{
  -- multiple codes/names can be defined, the first one is the primary name
  -- additional aliases can be defined
  domain_names = {
    himmelsthuer = 'Himmelsthuer',
  },

  -- 32 byte random data in hexadecimal encoding
  -- This data must be unique among all sites and domains!
  -- Can be generated using: echo $(hexdump -v -n 32 -e '1/1 "%02x"' </dev/urandom)
  domain_seed = '333f6c3143ce2ac46b4989bc9d189388fc14aa850ec8e622a3f29fec9526ce67',

  -- unique network prefixes per domain
  prefix4 = '10.16.0.0/16',
  prefix6 = 'fd8a:6551:7b84:16::/64',

  next_node = {
    name = { 'router.freifunk-hildesheim.de', 'local.ffhi', 'router' },
    ip6 = 'fd8a:6551:7b84:16::1',
  },

  wifi24 = {
    channel = 1,
    ap = {
      ssid = "freifunk-hildesheim.de",
    },
    mesh = {
      id = 'ffhi-mesh-10', -- usually you don't want users to connect to this mesh-SSID, so use a cryptic id that no one will accidentally mistake for the client WiFi
    },
  },

  wifi5 = {
    channel = 44,
    ap = {
      ssid = "freifunk-hildesheim.de",
    },
    mesh = {
      id = 'ffhi-mesh-10',
    },
  },

  mesh = {
    batman_adv = {
      routing_algo = 'BATMAN_IV',
    },
  },

  mesh_vpn = {
    wireguard = {
      peers = {
        gw01 = {
          -- PLATZHALTER: echter Schlüssel fehlt noch in gateways.json
          public_key = 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=',
          endpoint = 'gw01.freifunk-hildesheim.de:51816',
        },
      },
    },
  },
}
